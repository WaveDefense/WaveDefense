<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game - Maintenance</title>

<style>
    * {
        box-sizing: border-box;
        image-rendering: pixelated;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #101010;
        font-family: monospace;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
    }

    .screen {
        width: 100%;
        max-width: 900px;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
    }

    .panel {
        width: min(700px, 94vw);
        background: #181818;
        border: 4px solid #555;
        box-shadow:
            8px 8px 0 #080808,
            inset 0 0 0 3px #252525;
        padding: 6px;
    }

    .inner {
        border: 2px solid #333;
        padding: 45px 25px;
        text-align: center;
        background:
            repeating-linear-gradient(
                0deg,
                #181818 0px,
                #181818 3px,
                #161616 3px,
                #161616 6px
            );
    }

    .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 25px;
        border: 5px solid #777;
        background: #242424;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 38px;
        font-weight: bold;
        box-shadow: 5px 5px 0 #090909;
    }

    .title {
        margin: 0 0 18px;
        font-size: clamp(22px, 5vw, 38px);
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #eee;
        text-shadow: 3px 3px 0 #000;
    }

    .message {
        margin: 0 auto;
        max-width: 550px;
        color: #aaa;
        font-size: clamp(13px, 3vw, 18px);
        line-height: 1.8;
        letter-spacing: 1px;
    }

    .status {
        display: inline-block;
        margin-top: 28px;
        padding: 10px 18px;
        border: 3px solid #555;
        background: #111;
        color: #888;
        font-size: 12px;
        letter-spacing: 2px;
        box-shadow: 4px 4px 0 #080808;
    }

    .footer {
        margin-top: 25px;
        color: #555;
        font-size: 10px;
        letter-spacing: 2px;
    }
</style>
</head>

<body>

<div class="screen">
    <div class="panel">
        <div class="inner">

            <div class="icon">!</div>

            <h1 class="title">Game Sedang Diperbaiki</h1>

            <p class="message">
                Harap kembali lagi nanti.<br>
                Game sedang dalam proses perbaikan dan pengembangan.
            </p>

            <div class="status">
                [ MAINTENANCE ]
            </div>

            <div class="footer">
                PLEASE WAIT...
            </div>

        </div>
    </div>
</div>

</body>
</html>
